<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Sync — Task Queue</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #333;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .tasks-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }

    .tasks-section h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #333;
    }

    .task-item {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #667eea;
    }

    .task-content {
      color: #333;
      word-wrap: break-word;
      margin-bottom: 8px;
    }

    .task-meta {
      font-size: 12px;
      color: #999;
    }

    .task-status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-right: 8px;
    }

    .task-status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .task-status.in_progress {
      background: #cce5ff;
      color: #004085;
    }

    .task-status.done {
      background: #d4edda;
      color: #155724;
    }

    .no-tasks {
      color: #999;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    .loading {
      text-align: center;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Work Sync</h1>
    <p class="subtitle">Post a task from your phone, desktop picks it up</p>

    <div id="message"></div>

    <form id="taskForm">
      <div class="form-group">
        <label for="apiKey">API Key</label>
        <input
          type="password"
          id="apiKey"
          placeholder="Your API key"
          required
          autocomplete="off"
        >
      </div>

      <div class="form-group">
        <label for="content">Task / Note</label>
        <textarea
          id="content"
          placeholder="What do you want to work on?"
          required
        ></textarea>
      </div>

      <button type="submit" id="submitBtn">Send Task</button>
    </form>

    <div class="tasks-section">
      <h2>Your Tasks</h2>
      <div id="tasksList" class="loading">Loading tasks...</div>
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const contentInput = document.getElementById('content');
    const taskForm = document.getElementById('taskForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageDiv = document.getElementById('message');
    const tasksList = document.getElementById('tasksList');

    // Load API key from localStorage
    const savedKey = localStorage.getItem('work-sync-api-key');
    if (savedKey) {
      apiKeyInput.value = savedKey;
    }

    // Save API key when changed
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('work-sync-api-key', apiKeyInput.value);
    });

    function showMessage(text, type) {
      messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 5000);
    }

    async function loadTasks() {
      const apiKey = apiKeyInput.value;
      if (!apiKey) {
        tasksList.innerHTML = '<div class="no-tasks">Enter your API key to see tasks</div>';
        return;
      }

      try {
        const response = await fetch('/api/tasks', {
          headers: { 'x-api-key': apiKey },
        });

        if (!response.ok) {
          tasksList.innerHTML = '<div class="no-tasks">Failed to load tasks</div>';
          return;
        }

        const tasks = await response.json();

        if (tasks.length === 0) {
          tasksList.innerHTML = '<div class="no-tasks">No tasks yet</div>';
          return;
        }

        tasksList.innerHTML = tasks
          .map(task => `
            <div class="task-item">
              <div class="task-content">${escapeHtml(task.content)}</div>
              <div class="task-meta">
                <span class="task-status ${task.status}">${task.status}</span>
                <span>${new Date(task.created).toLocaleDateString()} ${new Date(task.created).toLocaleTimeString()}</span>
              </div>
              ${task.result ? `<div class="task-meta" style="margin-top: 8px; color: #333;"><strong>Result:</strong> ${escapeHtml(task.result)}</div>` : ''}
            </div>
          `)
          .join('');
      } catch (error) {
        console.error('Error loading tasks:', error);
        tasksList.innerHTML = '<div class="no-tasks">Error loading tasks</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    taskForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const apiKey = apiKeyInput.value;
      const content = contentInput.value;

      if (!apiKey) {
        showMessage('Please enter your API key', 'error');
        return;
      }

      if (!content.trim()) {
        showMessage('Please enter a task', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
          },
          body: JSON.stringify({ content: content.trim() }),
        });

        if (!response.ok) {
          const error = await response.json();
          showMessage(`Error: ${error.error || 'Failed to create task'}`, 'error');
          return;
        }

        showMessage('Task sent! 🎉', 'success');
        contentInput.value = '';
        await loadTasks();
      } catch (error) {
        console.error('Error:', error);
        showMessage('Network error', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Task';
      }
    });

    // Load tasks on page load and when API key changes
    loadTasks();
    apiKeyInput.addEventListener('change', loadTasks);
  </script>
</body>
</html>
